plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openflipclock'
    compileSdk 34

    defaultConfig {
        applicationId 'org.openflipclock'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1.0-beta'
    }

    signingConfigs {
        release {
            // Fixed public keystore so every build installs over the previous one.
            // For a store release, replace with your own private keystore.
            storeFile file('openflipclock.jks')
            storePassword 'openflipclock'
            keyAlias 'openflipclock'
            keyPassword 'openflipclock'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
